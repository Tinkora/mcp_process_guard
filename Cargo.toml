[package]
name = "mcp-process-guard"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Bounded lifecycle checks for explicitly launched MCP stdio servers"
license = "MIT"
repository = "https://github.com/Tinkora/mcp_process_guard"
homepage = "https://github.com/Tinkora/mcp_process_guard"
keywords = ["mcp", "stdio", "process", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
