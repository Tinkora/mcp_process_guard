name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          for file in README README.zh-CN CONTRIBUTING CONTRIBUTING.zh-CN SECURITY SECURITY.zh-CN SUPPORT SUPPORT.zh-CN CODE_OF_CONDUCT CODE_OF_CONDUCT.zh-CN; do test -f "$file.md"; done
          grep -Fq 'README.zh-CN.md' README.md
          grep -Fq 'README.md' README.zh-CN.md

