name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 2 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@a0b7698f3eeca5643ee85c132b4fa1365e6b2391 # v3.30.5
        with: {languages: actions}
      - uses: github/codeql-action/analyze@a0b7698f3eeca5643ee85c132b4fa1365e6b2391 # v3.30.5

