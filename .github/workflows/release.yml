name: Release

on:
  push:
    tags: ["v*.*.*-alpha.*", "v*.*.*-beta.*", "v*.*.*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Validate release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${RELEASE_TAG}" = "v${version}"
          grep -Fq "## [${version}]" CHANGELOG.md
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "${GITHUB_SHA}"
          git fetch --no-tags origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "${GITHUB_SHA}"
          for attempt in {1..40}; do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&per_page=10" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA)][0].conclusion // "pending"')"
            test "$conclusion" = success && break
            test "$conclusion" != failure
            test "$attempt" -lt 40
            sleep 15
          done

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64, binary: mcp-process-guard, archive: tar}
          - {os: macos-15, target: aarch64-apple-darwin, platform: macos-arm64, binary: mcp-process-guard, archive: tar}
          - {os: macos-15, target: x86_64-apple-darwin, platform: macos-x86_64, binary: mcp-process-guard, archive: tar}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, platform: windows-x86_64, binary: mcp-process-guard.exe, archive: zip}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - shell: bash
        run: rustup target add "${{ matrix.target }}" --toolchain 1.85.0
      - shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          name="mcp-process-guard-${RELEASE_TAG}-${{ matrix.platform }}"
          mkdir -p "stage/$name" dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" LICENSE README.md README.zh-CN.md CHANGELOG.md "stage/$name/"
          tar -czf "dist/$name.tar.gz" -C stage "$name"
      - if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "mcp-process-guard-$env:RELEASE_TAG-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path "stage/$name", dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}", LICENSE, README.md, README.zh-CN.md, CHANGELOG.md "stage/$name/"
          Compress-Archive "stage/$name" "dist/$name.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "release-${{ matrix.platform }}", path: "dist/*", if-no-files-found: error}

  evidence:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {path: dist, merge-multiple: true}
      - run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --describe crate --target all --spec-version 1.5
          mv mcp-process-guard.cdx.json "dist/mcp-process-guard-${RELEASE_TAG}.cdx.json"
          (cd dist && sha256sum -- * > SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          cat > expected-assets.txt <<EOF
          SHA256SUMS
          mcp-process-guard-${RELEASE_TAG}-linux-x86_64.tar.gz
          mcp-process-guard-${RELEASE_TAG}-macos-arm64.tar.gz
          mcp-process-guard-${RELEASE_TAG}-macos-x86_64.tar.gz
          mcp-process-guard-${RELEASE_TAG}-windows-x86_64.zip
          mcp-process-guard-${RELEASE_TAG}.cdx.json
          EOF
          sort -o expected-assets.txt expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: verified-release-assets, path: "dist/*", if-no-files-found: error}

  attest:
    needs: evidence
    runs-on: ubuntu-24.04
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: verified-release-assets, path: dist}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.cdx.json
            dist/SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/mcp-process-guard-${{ env.RELEASE_TAG }}.cdx.json

  publish:
    needs: [evidence, attest]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: verified-release-assets, path: dist}
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          prerelease=()
          [[ "${RELEASE_TAG}" == *-* ]] && prerelease+=(--prerelease)
          gh release create "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --title "MCP Process Guard ${RELEASE_TAG}" --generate-notes "${prerelease[@]}"
